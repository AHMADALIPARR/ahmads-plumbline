name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell/actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10'
      - name: Cabal update
        run: cabal update
      - name: Build
        run: cabal build all
      - name: Test
        run: cabal test --enable-tests || echo "Tests unavailable or failed"

  c-bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C sources
        run: |
          gcc -c -Wall -Wextra -O2 cbits/dense_parlog.c -o /tmp/dense.o
          gcc -c -Wall -Wextra -O2 cbits/raw_gc.c -o /tmp/gc.o
          gcc -c -Wall -Wextra -O2 cbits/boyer_moore.c -o /tmp/bm.o
          echo "C compilation succeeded"

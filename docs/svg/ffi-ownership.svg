<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <title>FFI Memory Ownership</title>
  <desc>Haskell indices into C static arena</desc>
  <rect x="10" y="20" width="100" height="40" fill="none" stroke="#333" stroke-width="1"/>
  <text x="60" y="44" text-anchor="middle" font-size="9" font-family="system-ui">Haskell</text>
  <text x="60" y="56" text-anchor="middle" font-size="7" font-family="monospace">Word32 idx</text>
  <rect x="190" y="20" width="100" height="40" fill="none" stroke="#333" stroke-width="1"/>
  <text x="240" y="44" text-anchor="middle" font-size="9" font-family="system-ui">C Arena</text>
  <text x="240" y="56" text-anchor="middle" font-size="7" font-family="monospace">static DWord[]</text>
  <path d="M110 40 L190 40" stroke="#333" stroke-width="1" marker-end="url(#arr2)"/>
  <text x="150" y="35" text-anchor="middle" font-size="7" font-family="system-ui">index</text>
  <rect x="100" y="75" width="100" height="30" fill="none" stroke="#666" stroke-width="0.8"/>
  <text x="150" y="94" text-anchor="middle" font-size="8" font-family="system-ui">C owns memory</text>
  <defs><marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#333"/></marker></defs>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <title>H + CNOT circuit producing Bell state</title>
  <desc>Two-qubit circuit: Hadamard on q0 followed by CNOT produces |Φ+>.</desc>
  <!-- Wires -->
  <line x1="30" y1="50" x2="290" y2="50" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="30" y1="110" x2="290" y2="110" stroke="#1a1a2e" stroke-width="1"/>
  <!-- H gate -->
  <rect x="70" y="38" width="24" height="24" fill="none" stroke="#16213e" stroke-width="1.2"/>
  <text x="76" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#0f3460">H</text>
  <!-- CNOT -->
  <circle cx="140" cy="50" r="6" fill="none" stroke="#16213e" stroke-width="1.2"/>
  <line x1="140" y1="50" x2="140" y2="110" stroke="#16213e" stroke-width="1"/>
  <circle cx="140" cy="110" r="8" fill="none" stroke="#16213e" stroke-width="1.2"/>
  <line x1="132" y1="110" x2="148" y2="110" stroke="#16213e" stroke-width="1"/>
  <line x1="140" y1="102" x2="140" y2="118" stroke="#16213e" stroke-width="1"/>
  <!-- Labels -->
  <text x="10" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#0f3460">q0</text>
  <text x="10" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#0f3460">q1</text>
  <text x="160" y="40" font-family="system-ui, sans-serif" font-size="9" fill="#0f3460">|00></text>
  <text x="160" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#0f3460">|Φ+></text>
  <!-- Small Bloch sphere -->
  <circle cx="260" cy="80" r="25" fill="none" stroke="#16213e" stroke-width="1"/>
  <line x1="260" y1="55" x2="260" y2="105" stroke="#1a1a2e" stroke-width="0.8"/>
  <line x1="235" y1="80" x2="285" y2="80" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="248" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#0f3460">Bloch</text>
</svg>

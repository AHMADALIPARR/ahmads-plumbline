<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <title>Qubit entanglement circuit</title>
  <desc>Hadamard followed by CNOT producing the Bell state Phi-plus from |00>.</desc>
  <g stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round">
    <!-- Wires -->
    <line x1="40" y1="50" x2="280" y2="50" />
    <line x1="40" y1="110" x2="280" y2="110" />
    <!-- Hadamard box -->
    <rect x="70" y="38" width="22" height="24" fill="none" />
    <text x="81" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1a">H</text>
    <!-- CNOT -->
    <circle cx="140" cy="50" r="4" fill="#1a1a1a" />
    <line x1="140" y1="50" x2="140" y2="110" />
    <circle cx="140" cy="110" r="8" fill="none" />
    <line x1="132" y1="110" x2="148" y2="110" />
    <line x1="140" y1="102" x2="140" y2="118" />
  </g>
  <!-- Bloch sphere (minimal) -->
  <g stroke="#1a1a1a" stroke-width="1" fill="none">
    <ellipse cx="250" cy="50" rx="22" ry="22" />
    <ellipse cx="250" cy="50" rx="22" ry="8" />
    <line x1="250" y1="28" x2="250" y2="72" />
  </g>
  <text x="20" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1a">q0</text>
  <text x="20" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1a">q1</text>
  <text x="160" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#333">|00> → H⊗I → (|00>+|10>)/√2</text>
  <text x="160" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#333">CNOT → |Φ+> = (|00>+|11>)/√2</text>
  <text x="250" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#555">Bloch</text>
</svg>

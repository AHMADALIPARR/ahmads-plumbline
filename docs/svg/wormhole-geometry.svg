<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <title>Morris–Thorne wormhole embedding diagram</title>
  <desc>Idealized spatial embedding of a traversable wormhole with throat radius r0 and asymptotic regions.</desc>
  <!-- Left asymptotic region -->
  <path d="M 20 90 C 60 40, 100 50, 140 90" fill="none" stroke="#1a1a2e" stroke-width="1.2"/>
  <path d="M 20 90 C 60 140, 100 130, 140 90" fill="none" stroke="#1a1a2e" stroke-width="1.2"/>
  <!-- Throat -->
  <path d="M 140 90 C 150 70, 170 70, 180 90" fill="none" stroke="#16213e" stroke-width="1.5"/>
  <path d="M 140 90 C 150 110, 170 110, 180 90" fill="none" stroke="#16213e" stroke-width="1.5"/>
  <!-- Right asymptotic region -->
  <path d="M 180 90 C 220 50, 260 40, 300 90" fill="none" stroke="#1a1a2e" stroke-width="1.2"/>
  <path d="M 180 90 C 220 130, 260 140, 300 90" fill="none" stroke="#1a1a2e" stroke-width="1.2"/>
  <!-- Labels -->
  <text x="70" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#0f3460">r</text>
  <text x="160" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#0f3460">r_0</text>
  <text x="160" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#0f3460">z(r)</text>
  <!-- Arrows -->
  <path d="M 50 90 L 60 90" stroke="#0f3460" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 270 90 L 260 90" stroke="#0f3460" stroke-width="1" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#0f3460"/>
    </marker>
  </defs>
</svg>

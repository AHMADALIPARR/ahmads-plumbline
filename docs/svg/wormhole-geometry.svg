<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <title>Wormhole spatial geometry</title>
  <desc>Illustrative embedding of a Morris-Thorne traversable wormhole throat. Two asymptotic regions joined by a narrow throat at r0.</desc>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round">
    <path d="M20 90 C 60 40, 100 30, 140 90" />
    <path d="M20 90 C 60 140, 100 150, 140 90" />
    <ellipse cx="160" cy="90" rx="18" ry="8" />
    <path d="M180 90 C 220 40, 260 30, 300 90" />
    <path d="M180 90 C 220 140, 260 150, 300 90" />
    <path d="M70 70 L 90 70" marker-end="url(#arrow)" />
    <path d="M230 70 L 250 70" marker-end="url(#arrow)" />
  </g>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#1a1a1a" />
    </marker>
  </defs>
  <text x="160" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1a">r0</text>
  <text x="50" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#333">r</text>
  <text x="270" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#333">r</text>
  <text x="160" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#333">z(r)</text>
  <text x="160" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#555">throat</text>
</svg>
